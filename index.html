<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аквилон · Люди</title>
<meta name="description" content="Внутренний HR-портал: правила, процедуры, заявления и связь с отделом персонала.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F1F7FE; --surface-2:#E3F0FD; --card:#FFFFFF; --line:#D3E4F7;
  --accent:#1F6FD1; --accent-hover:#185DB3; --accent-soft:#DCEBFC; --on-accent:#FFFFFF;
  --text:#0E2A47; --muted:#4F6985; --faint:#7F95AE;
  --new:#1F6FD1; --new-bg:#DCEBFC; --work:#A86A00; --work-bg:#FDF0D5; --done:#17804F; --done-bg:#DAF3E6;
  --danger:#C23A3A; --shadow:0 1px 2px rgba(14,42,71,.06),0 8px 24px rgba(14,42,71,.06);
  --r:16px; --r-sm:10px;
  --f-head:"Unbounded",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071629; --surface:#0C2240; --surface-2:#112C52; --card:#0E2645; --line:#1C3D66;
    --accent:#5DA3F7; --accent-hover:#7DB6FA; --accent-soft:#15375F; --on-accent:#061426;
    --text:#E7F0FB; --muted:#A3BAD5; --faint:#7189A8;
    --new:#7DB6FA; --new-bg:#15375F; --work:#F2B84B; --work-bg:#3A2C0E; --done:#4FD08F; --done-bg:#0F3A28;
    --danger:#F07C7C; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071629; --surface:#0C2240; --surface-2:#112C52; --card:#0E2645; --line:#1C3D66;
  --accent:#5DA3F7; --accent-hover:#7DB6FA; --accent-soft:#15375F; --on-accent:#061426;
  --text:#E7F0FB; --muted:#A3BAD5; --faint:#7189A8;
  --new:#7DB6FA; --new-bg:#15375F; --work:#F2B84B; --work-bg:#3A2C0E; --done:#4FD08F; --done-bg:#0F3A28;
  --danger:#F07C7C; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);font-weight:600;line-height:1.2;margin:0;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-soft:hover{border-color:var(--accent)}
.btn-sm{padding:7px 13px;font-size:14px}
.btn-link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.ico{width:18px;height:18px;flex:none}

/* header */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:var(--f-head);font-size:15px;white-space:nowrap}
.logo b{font-weight:700}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:16px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 11px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:14.5px;font-weight:500;white-space:nowrap}
.nav a:hover{color:var(--text);background:var(--surface)}
.nav a.hr-link{color:var(--accent);background:var(--accent-soft)}
.top-act{display:flex;align-items:center;gap:10px}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}

/* hero */
.hero{padding:56px 0 40px;background:radial-gradient(1200px 400px at 85% -10%,var(--surface-2),transparent 70%),linear-gradient(var(--surface),var(--bg))}
.hero-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:32px;align-items:start}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px;margin-bottom:18px}
.hero h1{font-size:clamp(28px,4.2vw,46px);font-weight:700;max-width:14ch}
.hero-sub{color:var(--muted);font-size:18px;margin-top:16px;max-width:52ch}
.quick{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.quick .btn{padding:12px 20px}
.event{display:flex;gap:14px;align-items:center;margin-top:28px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);max-width:520px}
.event-date{flex:none;width:56px;height:56px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;text-align:center;line-height:1.05}
.event-date b{font-family:var(--f-head);font-size:20px;display:block}
.event-date span{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.event small{color:var(--faint);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.event p{font-weight:600;line-height:1.35}
.event .meta{font-weight:400;color:var(--muted);font-size:14px}
.memo{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.memo h2{font-size:17px;display:flex;align-items:center;gap:10px}
.memo ul{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:4px}
.memo li{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.memo li:first-child{border-top:0}
.memo li b{font-family:var(--f-head);font-size:22px;color:var(--accent);min-width:72px;font-weight:600}
.memo li span{color:var(--muted);font-size:15px}

/* sections */
section.sec{padding:64px 0}
section.sec.alt{background:var(--surface)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-num{font-family:var(--f-head);font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.06em;margin-bottom:8px}
.sec-head h2{font-size:clamp(22px,3vw,30px)}
.sec-head p{color:var(--muted);margin-top:8px;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.tag{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.warn{background:var(--work-bg);color:var(--work)}
.tag.ok{background:var(--done-bg);color:var(--done)}
.tag.plain{background:var(--surface-2);color:var(--muted)}

/* announcements */
.ann-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
.ann-main{padding:28px;background:linear-gradient(145deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,#0E2A47) 100%);color:#fff;border:0;display:flex;flex-direction:column;gap:14px;min-height:280px}
.ann-main .tag{background:rgba(255,255,255,.18);color:#fff;align-self:flex-start}
.ann-main h3{font-size:22px;line-height:1.25}
.ann-main p{opacity:.92;flex:1}
.ann-main .btn{align-self:flex-start;background:#fff;color:#0E2A47}
.ann-main .btn:hover{background:#E3F0FD}
.feed{display:grid;gap:12px}
.feed-item{display:flex;gap:16px;padding:16px 18px}
.feed-date{flex:none;width:52px;text-align:center;border-right:1px solid var(--line);padding-right:14px}
.feed-date b{display:block;font-family:var(--f-head);font-size:22px;line-height:1.1}
.feed-date span{font-size:12.5px;color:var(--muted)}
.feed-item h3{font-family:var(--f-body);font-weight:600;font-size:16px;margin:6px 0 4px}
.feed-item p{color:var(--muted);font-size:14.5px}

/* docs */
.docs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc{overflow:hidden}
.doc summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:16px 18px}
.doc summary::-webkit-details-marker{display:none}
.doc-code{flex:none;font-family:var(--f-head);font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:6px 9px;border-radius:8px;min-width:78px;text-align:center}
.doc-t{flex:1;min-width:0}
.doc-t b{display:block;font-weight:600;line-height:1.3}
.doc-t span{font-size:13px;color:var(--faint)}
.chev{flex:none;width:20px;height:20px;color:var(--muted);transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}
.doc-body{padding:0 18px 18px 110px}
.doc-body p{color:var(--muted);font-size:15px}
.doc-body h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.doc-body ul{margin:0 0 14px;padding-left:18px}
.doc-body li{margin:4px 0}

/* procedures */
.proc{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.tabs{display:flex;flex-direction:column;gap:6px}
.tab{text-align:left;border:1px solid transparent;background:none;padding:14px 16px;border-radius:12px;cursor:pointer;font-weight:500;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.tab small{font-size:12px;color:var(--faint);font-weight:500}
.tab:hover{background:var(--card);color:var(--text)}
.tab[aria-selected="true"]{background:var(--card);border-color:var(--line);color:var(--text);box-shadow:var(--shadow)}
.tab[aria-selected="true"] small{color:var(--accent)}
.panel{padding:28px}
.panel h3{font-size:21px;margin:10px 0 8px}
.panel>p{color:var(--muted)}
.steps{list-style:none;padding:0;margin:24px 0;counter-reset:s;display:grid;gap:0}
.steps li{counter-increment:s;position:relative;padding:0 0 22px 52px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:14px}
.steps li:not(:last-child)::after{content:"";position:absolute;left:16.5px;top:36px;bottom:4px;width:1px;background:var(--line)}
.steps b{display:block;font-weight:600}
.steps span{color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.svc-card{padding:20px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.svc-card:hover{border-color:var(--accent)}
.svc-ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.svc-ic svg{width:22px;height:22px}
.svc-card h3{font-family:var(--f-body);font-size:17px;font-weight:600}
.svc-card p{color:var(--muted);font-size:14.5px;flex:1}
.svc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.svc-foot small{color:var(--faint);font-size:13px}
.svc-foot small b{color:var(--text);font-weight:600}

/* info */
.info-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;align-items:start}
.contacts{padding:8px 20px}
.contact{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.contact:first-of-type{border-top:0}
.contact .svc-ic{width:40px;height:40px}
.contact div{flex:1;min-width:0}
.contact small{display:block;color:var(--faint);font-size:12.5px}
.contact b{font-weight:600;word-break:break-all}
.faq{display:grid;gap:10px}
.faq details{padding:0}
.faq summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:center;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq summary span{flex:1}
.faq details p{padding:0 18px 18px;color:var(--muted)}
.sub-h{font-size:18px;margin:44px 0 18px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.person{padding:20px;display:flex;flex-direction:column;gap:12px}
.person-top{display:flex;gap:14px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:16px;flex:none}
.person h3{font-family:var(--f-body);font-size:17px;font-weight:600}
.person-top p{color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.mail{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);word-break:break-all}
.mail button{flex:none}

/* my + ideas */
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
.list{display:grid;gap:12px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--card)}
.req{padding:18px}
.req-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.req-top h3{font-family:var(--f-body);font-size:16px;font-weight:600;flex:1;min-width:0}
.st{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-new{background:var(--new-bg);color:var(--new)}
.st-work{background:var(--work-bg);color:var(--work)}
.st-done{background:var(--done-bg);color:var(--done)}
.req-meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13.5px;color:var(--muted)}
.req-meta b{color:var(--text);font-weight:500}
.req-text{margin-top:10px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.reply{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--done-bg);font-size:15px}
.reply small{display:block;font-weight:600;color:var(--done);font-size:12.5px;margin-bottom:2px}
.idea-form{padding:18px;display:grid;gap:12px;margin-bottom:16px}
.idea{padding:16px 18px}
.idea p{margin-top:8px;white-space:pre-wrap;word-break:break-word}
.idea-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--faint)}
.btn-del{background:none;border:0;color:var(--danger);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0}
.note{padding:16px 18px;border-radius:var(--r);background:var(--work-bg);color:var(--text);font-size:15px}
.note ul{margin:8px 0 0;padding-left:18px}

/* HR panel */
.hr-sec{background:linear-gradient(var(--surface-2),var(--surface))}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.counter{padding:18px 20px}
.counter b{font-family:var(--f-head);font-size:30px;display:block;line-height:1.1}
.counter span{color:var(--muted);font-size:14px}
.counter.c-new b{color:var(--new)}.counter.c-work b{color:var(--work)}.counter.c-done b{color:var(--done)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.hr-card{padding:18px;display:flex;flex-direction:column;gap:10px}
.hr-who{font-size:13.5px;color:var(--muted)}
.hr-who b{color:var(--text)}
.hr-edit{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.hr-edit .full{grid-column:1/-1;display:flex;justify-content:flex-end}

/* forms */
.field{display:grid;gap:6px}
.field>label,.field>.lbl{font-size:14px;font-weight:600}
.field .hint{font-size:13px;color:var(--faint)}
input[type=text],input[type=date],select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);transition:border-color .15s}
textarea{resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
[aria-invalid="true"]{border-color:var(--danger)!important}
.err{color:var(--danger);font-size:13.5px;font-weight:500;min-height:0}
.err:empty{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500;background:var(--bg)}
.opt input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.opt input:disabled+span{opacity:.4;text-decoration:line-through}
.counter-chars{font-size:12.5px;color:var(--faint);text-align:right}

dialog{border:0;padding:0;border-radius:20px;background:var(--card);color:var(--text);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 24px 64px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(7,22,41,.55);backdrop-filter:blur(3px)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 0}
.dlg-head h2{font-size:19px}
.x{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{color:var(--text)}
.dlg-body{padding:18px 22px 22px;display:grid;gap:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;padding-top:4px}

/* FAB */
.fab{position:fixed;right:20px;bottom:20px;z-index:50}
.fab-btn{box-shadow:0 10px 30px rgba(31,111,209,.4);padding:14px 20px;font-size:15px}
.fab-menu{position:absolute;right:0;bottom:calc(100% + 10px);width:280px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(7,22,41,.25);padding:8px;display:none}
.fab.open .fab-menu{display:block}
.fab-menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:left;font-weight:500}
.fab-menu button:hover{background:var(--surface)}
.fab-menu button small{display:block;color:var(--faint);font-size:12.5px;font-weight:400}
.fab-menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.fab-menu .ico{color:var(--accent)}

/* toasts */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast input{margin-top:8px;width:100%;padding:8px 10px;border-radius:8px;border:0;background:var(--bg);color:var(--text)}
.toast.bad{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* footer */
footer{background:var(--surface);border-top:1px solid var(--line);padding:40px 0 100px;font-size:14.5px;color:var(--muted)}
.foot{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px}
.foot h3{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px}
.foot p{margin:3px 0}
.demo{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.demo .filters{margin:0}

/* responsive */
@media (max-width:960px){
  .hero-grid,.ann-grid,.info-grid,.two{grid-template-columns:1fr}
  .proc{grid-template-columns:1fr}
  .tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;max-width:240px}
  .docs{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr 1fr}
  .top-in{flex-wrap:wrap;height:auto;padding:10px 16px;gap:8px 16px}
  .nav{order:3;flex-basis:100%;margin:0 -16px;padding:0 12px}
  .top-act{margin-left:auto}
  html{scroll-padding-top:120px}
}
@media (max-width:640px){
  .ask-top{display:none}
  .hero{padding:36px 0 28px}
  .hero-sub{font-size:16px}
  .quick .btn{flex:1 1 100%}
  section.sec{padding:44px 0}

  .counters{grid-template-columns:1fr 1fr 1fr;gap:8px}

  .fab-btn .fab-label{display:none}
  .fab-btn{padding:14px}
  .logo .logo-txt{display:none}
}

const Store = (() => {
  let ok = false;
  try { localStorage.setItem('__akv', '1'); localStorage.removeItem('__akv'); ok = true; } catch (e) {}
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const keys = p => { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(p)) out.push(k); } } catch (e) {} return out; };
  return { ok, get, set, keys };
})();

function myItems() { return (Store.get(REQ + ME, { items: [] }).items || []); }
function allItems() {
  return Store.keys(REQ).flatMap(k => {
    const owner = k.slice(REQ.length);
    return (Store.get(k, { items: [] }).items || []).map(it => ({ ...it, owner }));
  }).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
}
function addItem(item) {
  const key = REQ + ME;
  const doc = Store.get(key, { items: [] });
  doc.items = [item, ...(doc.items || [])].slice(0, 100);
  doc.updatedAt = new Date().toISOString();
  if (!Store.set(key, doc)) return false;
  return (Store.get(key, { items: [] }).items || []).some(x => x.id === item.id);
}
function updateItem(owner, id, patch) {
  const key = REQ + owner;
  const doc = Store.get(key, { items: [] });
  const it = (doc.items || []).find(x => x.id === id);
  if (!it) return false;
  Object.assign(it, patch, { updatedAt: new Date().toISOString() });
  doc.updatedAt = it.updatedAt;
  return Store.set(key, doc);
}
function ideas() { return Store.get('akv.ideas', []).sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 60); }

/* ============ Диалоги и формы ============ */
const dlg = document.getElementById('dlg');
function openDialog(title, body) {

const fieldErr = id => `<div class="err" id="${id}-err"></div>`;
const specSelect = (sel, allowAny) => `<select id="f-spec" name="spec">${allowAny ? `<option value="">${t('any_spec')}</option>` : ''}${TEAM.map(p => `<option value="${p.id}"${sel === p.id ? ' selected' : ''}>${esc(L(p.name))} — ${esc(L(p.role))}</option>`).join('')}</select>`;
const footBtns = () => `<div class="dlg-foot"><button type="button" class="btn btn-ghost" data-act="close">${t('cancel')}</button><button type="submit" class="btn btn-primary">${ic('send')}${t('send')}</button></div>`;

function openForm(kind, preset = {}) {

      <div class="field"><label for="f-type">${t('f_type')}</label><select id="f-type" name="type">${SERVICES.map(s => `<option value="${s.id}"${s.id === type ? ' selected' : ''}>${esc(L(s.title))}</option>`).join('')}</select></div>
      <div class="grid2" id="f-dates">
        <div class="field"><label for="f-from">${t('f_from')}</label><input type="date" id="f-from" name="from">${fieldErr('f-from')}</div>
        <div class="field"><label for="f-to">${t('f_to')}</label><input type="date" id="f-to" name="to">${fieldErr('f-to')}</div>
      </div>
      <div class="field"><label for="f-comment" id="f-comment-lbl">${t('f_comment')}</label><textarea id="f-comment" name="text" maxlength="2000"></textarea>${fieldErr('f-comment')}</div>
      ${footBtns()}
    </form>`);
    syncReqType();
  } else if (kind === 'question') {
    openDialog(t('dlg_question'), `<form id="fQ" data-kind="question" novalidate class="dlg-body" style="padding:0">
      <div class="grid2">
        <div class="field"><label for="f-topic">${t('f_topic')}</label><select id="f-topic" name="type">${TOPICS.map(x => `<option value="${x}"${x === (preset.topic || 'other') ? ' selected' : ''}>${t('t_' + x)}</option>`).join('')}</select></div>
        <div class="field"><label for="f-spec">${t('spec')}</label>${specSelect(preset.spec || '', true)}</div>
      </div>
      <div class="field"><label for="f-text">${t('f_text')}</label><textarea id="f-text" name="text" maxlength="2000" placeholder="${t('f_text_ph')}">${esc(preset.text || '')}</textarea>${fieldErr('f-text')}</div>
      ${footBtns()}
    </form>`);
    const ta = dlg.querySelector('#f-text'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  } else if (kind === 'meeting') {
    openDialog(t('dlg_meeting'), `<form id="fM" data-kind="meeting" novalidate class="dlg-body" style="padding:0">
      <div class="field"><label for="f-spec">${t('spec')}</label>${specSelect(preset.spec || TEAM[0].id, false)}</div>
      <div class="field"><label for="f-day">${t('f_date')}</label><input type="date" id="f-day" name="day" min="${todayIso()}" value="${nextWeekday(1)}">${fieldErr('f-day')}</div>
      <div class="field"><span class="lbl" id="slots-lbl">${t('f_time')}</span><div class="slots" id="f-slots" role="radiogroup" aria-labelledby="slots-lbl"></div>${fieldErr('f-slots')}</div>
      <div class="field"><span class="lbl" id="fmt-lbl">${t('f_format')}</span><div class="slots" role="radiogroup" aria-labelledby="fmt-lbl">
        <label class="opt"><input type="radio" name="format" value="office" checked><span>${t('fmt_office')}</span></label>
        <label class="opt"><input type="radio" name="format" value="video"><span>${t('fmt_video')}</span></label>
      </div></div>
      <div class="field"><label for="f-about">${t('f_about')}</label><textarea id="f-about" name="text" maxlength="1000" placeholder="${t('f_about_ph')}" style="min-height:72px"></textarea></div>
      ${footBtns()}

function syncReqType() {
  const type = dlg.querySelector('#f-type')?.value; if (!type) return;
  const s = SERVICES.find(x => x.id === type);
  dlg.querySelector('#f-dates').hidden = !s.dates;
  dlg.querySelector('#f-comment').placeholder = L(s.hint);
  dlg.querySelector('#f-comment-lbl').textContent = type === 'other' ? t('f_comment_req') : t('f_comment');
}

function dayProblem(day) {
  if (!day) return 'err_date';
  if (day < todayIso()) return 'err_past';
  const wd = parseDay(day).getDay();
  if (wd === 0 || wd === 6) return 'err_weekday';
  return '';
}
function slotBusy(spec, day, slot) {
  let h = 7; for (const c of spec + day + slot) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  if (h % 4 === 0) return true;
  if (day === todayIso()) { const [hh] = slot.split(':').map(Number); if (hh <= new Date().getHours()) return true; }
  return allItems().some(x => x.kind === 'meeting' && x.spec === spec && x.day === day && x.slot === slot);
}
function renderSlots() {
  const box = dlg.querySelector('#f-slots'); if (!box) return;
  const spec = dlg.querySelector('#f-spec').value, day = dlg.querySelector('#f-day').value;
  const prob = dayProblem(day);
  setErr('f-day', prob ? t(prob) : '');
  if (prob) { box.innerHTML = `<span class="hint">${t('pick_day')}</span>`; return; }
  const free = SLOTS.filter(s => !slotBusy(spec, day, s));
  box.innerHTML = free.length ? SLOTS.map(s => `<label class="opt"><input type="radio" name="slot" value="${s}"${slotBusy(spec, day, s) ? ' disabled' : ''}><span>${s}</span></label>`).join('') : `<span class="hint">${t('no_slots')}</span>`;
}

function setErr(id, msg) {
  const e = dlg.querySelector('#' + id + '-err'); if (e) e.textContent = msg;
  const f = dlg.querySelector('#' + id); if (f) f.setAttribute('aria-invalid', msg ? 'true' : 'false');
}

function submitForm(form) {
  const kind = form.dataset.kind, fd = new FormData(form);
  const v = k => (fd.get(k) || '').toString().trim();
  let ok = true, first = null;
  const fail = (id, key) => { setErr(id, t(key)); ok = false; first = first || id; };
  const item = { id: uid(), kind, status: 'new', createdAt: new Date().toISOString(), lang, reply: '', text: v('text'), spec: '' };

  if (kind === 'request') {
    ['f-from', 'f-to', 'f-comment'].forEach(id => setErr(id, ''));
    item.type = v('type');
    const s = SERVICES.find(x => x.id === item.type);
    if (s.dates) {
      item.from = v('from'); item.to = v('to');
      if (!item.from) fail('f-from', 'err_from');
      if (item.from && item.to && item.to < item.from) fail('f-to', 'err_to');
    }
    if (item.type === 'other' && !item.text) fail('f-comment', 'err_comment');
  } else if (kind === 'question') {
    setErr('f-text', '');
    item.type = v('type'); item.spec = v('spec');
    if (!item.text) fail('f-text', 'err_text');
  } else if (kind === 'meeting') {
    setErr('f-slots', '');
    item.type = 'meeting'; item.spec = v('spec'); item.day = v('day'); item.slot = v('slot'); item.format = v('format') || 'office';
    const prob = dayProblem(item.day);
    if (prob) fail('f-day', prob);
    else if (!item.slot) fail('f-slots', 'err_slot');
  }
  if (!ok) { const f = dlg.querySelector('#' + first); if (f && f.focus) f.focus(); return; }

  if (addItem(item)) {
    dlg.close();
    toast(t('toast_ok'));
    renderData();
    document.getElementById('my').scrollIntoView();
  } else {
    toast(t('toast_fail'), true);
  }
}

/* ============ Уведомления и копирование ============ */
function toast(msg, bad = false, extra = '') {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.innerHTML = esc(msg) + extra;
  box.appendChild(el);
  setTimeout(() => el.remove(), extra ? 8000 : 3200);
  return el;
}
async function copyText(v) {
  try {
    if (!navigator.clipboard) throw 0;
    await navigator.clipboard.writeText(v);
    toast(t('copied') + ': ' + v);
  } catch (e) {
    const el = toast(t('copy_fail'), false, `<input readonly value="${esc(v)}" aria-label="${esc(v)}">`);
    const inp = el.querySelector('input'); inp.focus(); inp.select();
  }
}

/* ============ Плавающая кнопка ============ */
function closeFab() {
  const f = document.getElementById('fab'); if (!f.classList.contains('open')) return;
  f.classList.remove('open'); document.getElementById('fabBtn')?.setAttribute('aria-expanded', 'false');
}
function toggleFab() {
  const f = document.getElementById('fab'); const open = !f.classList.contains('open');
  f.classList.toggle('open', open); document.getElementById('fabBtn').setAttribute('aria-expanded', String(open));
  if (open) f.querySelector('.fab-menu button')?.focus();
}

/* ============ События ============ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!e.target.closest('#fab')) closeFab();
  if (!b) return;
  const d = b.dataset;
  switch (d.act) {
    case 'lang': lang = d.v; Store.set('akv.lang', lang); renderAll(); break;
    case 'role': role = d.v; Store.set('akv.role', role); renderAll(); break;
    case 'ask': openForm('question', { topic: d.topic, text: d.text, spec: d.spec }); break;
    case 'meet': openForm('meeting', { spec: d.spec }); break;
    case 'request': openForm('request', { type: d.type }); break;
    case 'idea': closeFab(); document.getElementById('ideas').scrollIntoView(); setTimeout(() => document.getElementById('ideaText')?.focus({ preventScroll: true }), 300); break;
    case 'copy': closeFab(); copyText(d.v); break;
    case 'close': dlg.close(); break;
    case 'fab': toggleFab(); break;
    case 'tab': selectTab(+d.i, false); break;
    case 'filter': hrFilter = d.v; renderHr(); break;
    case 'del-idea':
      if (b.dataset.armed) {
        const rest = Store.get('akv.ideas', []).filter(i => i.id !== d.id);
        if (Store.set('akv.ideas', rest)) { toast(t('toast_del')); renderIdeas(); } else toast(t('toast_fail'), true);
      } else { b.dataset.armed = '1'; b.textContent = t('del_confirm'); setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = t('del'); } }, 4000); }
      break;
  }
});

function selectTab(i, focus) {
  procIdx = (i + PROCS.length) % PROCS.length;
  document.querySelectorAll('#procTabs .tab').forEach((tb, k) => { tb.setAttribute('aria-selected', k === procIdx); tb.tabIndex = k === procIdx ? 0 : -1; });
  const panel = document.getElementById('procPanel');
  panel.innerHTML = procPanel(); panel.setAttribute('aria-labelledby', 'ptab' + procIdx);
  const cur = document.getElementById('ptab' + procIdx);
  if (focus) cur.focus();
  cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.getElementById('fab').classList.contains('open')) { closeFab(); document.getElementById('fabBtn')?.focus(); } }
  if (e.target.matches && e.target.matches('#procTabs .tab')) {
    const map = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
    if (e.key in map) { e.preventDefault(); selectTab(procIdx + map[e.key], true); }
    if (e.key === 'Home') { e.preventDefault(); selectTab(0, true); }
    if (e.key === 'End') { e.preventDefault(); selectTab(PROCS.length - 1, true); }
  }
});

document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.kind) { e.preventDefault(); submitForm(f); return; }
  if (f.id === 'ideaForm') {
    e.preventDefault();
    const txt = f.text.value.trim(), err = document.getElementById('ideaErr');
    if (!txt) { err.textContent = t('err_idea'); f.text.setAttribute('aria-invalid', 'true'); f.text.focus(); return; }
    err.textContent = ''; f.text.setAttribute('aria-invalid', 'false');
    const list = Store.get('akv.ideas', []);
    list.push({ id: uid(), category: f.category.value, text: txt.slice(0, 600), createdAt: new Date().toISOString() });
    if (Store.set('akv.ideas', list)) { f.text.value = ''; document.getElementById('ideaCount').textContent = `0 / 600 ${t('chars')}`; toast(t('toast_idea')); renderIdeas(); }
    else toast(t('toast_fail'), true);
    return;
  }
  if (f.classList.contains('hr-edit')) {
    e.preventDefault();
    const ok = updateItem(f.dataset.owner, f.dataset.id, { status: f.status.value, reply: f.reply.value.trim() });
    toast(ok ? t('saved') : t('toast_fail'), !ok);
    if (ok) { renderHr(); renderMy(); }
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'ideaText') document.getElementById('ideaCount').textContent = `${e.target.value.length} / 600 ${t('chars')}`;
});
dlg.addEventListener('change', e => {
  if (e.target.id === 'f-type') syncReqType();
  if (e.target.id === 'f-spec' || e.target.id === 'f-day') renderSlots();
  if (e.target.name === 'slot') setErr('f-slots', '');
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

// Обновление «в реальном времени»: изменения из другой вкладки (например, HR сменил статус)
window.addEventListener('storage', e => { if (e.key && (e.key.startsWith(REQ) || e.key === 'akv.ideas')) renderData(); });

seed();
renderAll();
</script>
</body>
</html>
